            background: linear-gradient(135deg, #ffd555 0%, #ecc23e 50%, #b79100 100%);

            background: linear-gradient(90deg, transparent, rgba(255, 213, 85, 0.2), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .pulse-gold {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.2); }
        }

<main class="pt-24 pb-32 px-container-margin max-w-md mx-auto flex flex-col gap-8">

</section>
<!-- Main QR Card -->
<div class="bg-surface-container-low rounded-xl p-6 border border-outline-variant shadow-2xl relative overflow-hidden">
<!-- Subtle background aesthetic -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 blur-3xl rounded-full -mr-10 -mt-10"></div>
<div class="flex items-center justify-center gap-3 mb-8">
<div class="w-8 h-8 bg-[#41a124] rounded-lg flex items-center justify-center">
<span class="text-white font-bold text-lg">e</span>
</div>
<span class="font-heading-md text-heading-md text-on-surface">Pay via eSewa</span>
</div>

<!-- BB Logo Inset -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-10 h-10 bg-surface border-2 border-primary rounded-full flex items-center justify-center shadow-lg">
<span class="text-primary font-extrabold text-[10px] tracking-tighter">BB</span>
</div>
</div>
</div>
</div>
<p class="text-center text-on-surface-variant text-body-sm mt-4">Scan with your eSewa app</p>
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-body-sm uppercase tracking-wider mb-1">Amount due</p>

</div>
<div class="mt-8 flex flex-col items-center gap-4">

<span class="text-on-surface-variant text-body-sm">Ref: BB-PAY-9824711</span>
<button class="active:scale-90 transition-transform">

<span class="material-symbols-outlined text-[14px]">lock</span>

</div>

<script>
        // Simple countdown logic for visual effect
        let time = 299;
        const timerDisplay = document.querySelector('.font-action-bold.text-primary');
        
        setInterval(() => {
            if (time > 0) {
                time--;
                const minutes = Math.floor(time / 60);
                const seconds = time % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        // Interaction for tabs
        const tabs = document.querySelectorAll('section button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-primary', 'text-surface', 'shadow-lg', 'shadow-primary/10');
                    t.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                });
                tab.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                tab.classList.add('bg-primary', 'text-surface', 'shadow-lg', 'shadow-primary/10');
            });
        });
    </script>
<script>setTimeout(() => { window.location.href='my-wallet.html'; }, 10000);</script></body></html>
